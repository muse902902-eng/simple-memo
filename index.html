<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>간단한 메모장</title>
<style>*{box-sizing:border-box}body{font:16px/1.6 system-ui,sans-serif;color:#222;background:#fff;margin:0;padding:24px 16px}main{max-width:560px;margin:auto}h1{font-size:26px}section,li{border:1px solid #ddd;border-radius:12px;padding:20px;margin:16px 0}label{display:block;margin-top:12px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:10px;border:1px solid #aaa;border-radius:6px}textarea{min-height:120px;resize:vertical}button{padding:9px 16px;margin:12px 6px 0 0;border:1px solid #aaa;border-radius:6px;background:#f5f5f5;cursor:pointer}button:disabled{opacity:.5;cursor:wait}ul{list-style:none;padding:0}li p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}#who{overflow-wrap:anywhere}#status{min-height:26px;color:#555}time{font-size:13px;color:#666}[hidden]{display:none!important}</style>
<main><h1>간단한 메모장</h1>
<p id="status" role="status" aria-live="polite">불러오는 중…</p>
<section id="auth" hidden><form id="login">
<label for="email">이메일</label><input id="email" type="email" autocomplete="username" required>
<label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="6자 이상">
<button type="submit">로그인</button><button id="signup" type="button">회원가입</button>
</form></section>
<section id="app" hidden><div id="who"></div><button id="logout">로그아웃</button>
<form id="memo"><label for="content">메모 내용</label><textarea id="content" maxlength="10000" required></textarea><button id="save">저장</button></form>
<h2>내 메모</h2><ul id="list"></ul></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const client=window.supabase?.createClient('https://tazpskduihiskoauwibm.supabase.co','sb_publishable_dy3evgdYuxfDVwMBhNw6Wg_cQIFxocf',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let user=null,busy=false;
function message(text){$('status').textContent=text}
function errorText(e){const m=e.message||String(e);return /Invalid login credentials/.test(m)?'이메일 또는 비밀번호를 확인해 주세요.':/already registered/.test(m)?'이미 가입된 이메일입니다. 로그인해 주세요.':/rate limit/i.test(m)?'요청이 많습니다. 잠시 후 다시 시도해 주세요.':'오류: '+m}
async function run(task,label){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);message(label);try{await task()}catch(e){message(errorText(e))}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function listMemos(){const owner=user?.id;if(!owner)return;const {data,error}=await client.from('memos').select('id,content,created_at').eq('user_id',owner).order('created_at',{ascending:false});if(error)throw error;if(user?.id!==owner)return;$('list').replaceChildren();if(!data.length){const p=document.createElement('p');p.textContent='아직 메모가 없습니다.';$('list').append(p)}
for(const memo of data){const li=document.createElement('li'),p=document.createElement('p'),time=document.createElement('time'),button=document.createElement('button');p.textContent=memo.content;time.dateTime=memo.created_at;time.textContent=new Date(memo.created_at).toLocaleString('ko-KR');button.textContent='삭제';button.type='button';button.onclick=()=>run(async()=>{const {error}=await client.from('memos').delete().eq('id',memo.id).eq('user_id',user.id);if(error)throw error;await listMemos();message('삭제했습니다.')},'삭제 중…');li.append(p,time,document.createElement('br'),button);$('list').append(li)}}
async function show(session){user=session?.user||null;$('auth').hidden=!!user;$('app').hidden=!user;$('list').replaceChildren();$('who').textContent=user?.email||'';if(user)await listMemos()}
async function authenticate(signup){if(!$('login').reportValidity())return;await run(async()=>{const credentials={email:$('email').value.trim(),password:$('password').value};const {data,error}=signup?await client.auth.signUp(credentials):await client.auth.signInWithPassword(credentials);if(error)throw error;if(!data.session)throw new Error('가입은 접수되었으나 자동 로그인되지 않았습니다. 이메일 확인 설정을 확인해 주세요.');$('password').value='';await show(data.session);message(signup?'가입 후 로그인되었습니다.':'로그인했습니다.')},signup?'가입 중…':'로그인 중…')}
$('login').onsubmit=e=>{e.preventDefault();authenticate(false)};$('signup').onclick=()=>authenticate(true);
$('memo').onsubmit=e=>{e.preventDefault();const content=$('content').value.trim();if(!content){message('메모 내용을 입력해 주세요.');return}run(async()=>{const {error}=await client.from('memos').insert({user_id:user.id,content});if(error)throw error;$('content').value='';await listMemos();message('저장했습니다.')},'저장 중…')};
$('logout').onclick=()=>run(async()=>{const {error}=await client.auth.signOut({scope:'local'});if(error)throw error;$('content').value='';await show(null);message('로그아웃했습니다.')},'로그아웃 중…');
if(client){client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;$('list').replaceChildren();$('app').hidden=true;$('auth').hidden=false}});run(async()=>{const {data,error}=await client.auth.getSession();if(error)throw error;await show(data.session);message(data.session?'':'로그인하거나 회원가입해 주세요.')},'불러오는 중…')}else{message('연결 라이브러리를 불러오지 못했습니다. 새로고침해 주세요.')}
</script></html>
